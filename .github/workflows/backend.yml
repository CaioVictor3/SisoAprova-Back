name: Backend Node
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run test:all
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
